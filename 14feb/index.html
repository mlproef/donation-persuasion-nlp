<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 февраля</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Розовый фон с сердечками -->
    <div class="background-hearts"></div>
    
    <!-- Контейнер для фотографии -->
    <div class="photo-container">
        <img id="main-photo" src="images/photo1.jpg" alt="Фото" class="main-photo">
    </div>
    
    <!-- Кнопки выбора -->
    <div class="buttons-container">
        <button id="yes-btn" class="choice-btn">Да</button>
        <button id="no-btn" class="choice-btn">Нет</button>
    </div>
    
    <!-- Падающие сердечки (скрыто по умолчанию) -->
    <div id="falling-hearts" class="hidden"></div>
    
    <!-- Текст после нажатия "Да" -->
    <div id="yes-message" class="hidden">
        <h1 id="message-text">Твой подарок уже ждет тебя у дверей💖</h1>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
